services:
  - type: web
    name: upark-api
    env: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/upark-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: -Xmx512m

databases:
  - name: upark-db
    region: frankfurt  # ou la région de votre choix
    plan: free