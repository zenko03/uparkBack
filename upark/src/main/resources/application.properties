spring.application.name=upark
server.port=${PORT:8080}

# ========================================
# CONFIGURATION BASE DE DONNÉES LOCALE
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/upark
spring.datasource.username=postgres
spring.datasource.password=toky
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# === Configuration Hikari (Pool de connexions) ===
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.initialization-fail-timeout=0
spring.data.jdbc.dialect=POSTGRESQL
spring.datasource.hikari.connection-timeout=20000

# SSL désactivé pour développement local
spring.datasource.hikari.data-source-properties=sslmode=disable

logging.level.com.zaxxer.hikari=DEBUG