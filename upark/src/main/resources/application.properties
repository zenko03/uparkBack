spring.application.name=upark

# Render injecte DATABASE_URL (format postgres://...) → Spring Boot 3 le convertit automatiquement
spring.datasource.url=${DATABASE_URL}

# Driver détecté automatiquement grâce à l'URL, mais on peut le forcer si on veut
spring.datasource.driver-class-name=org.postgresql.Driver

# Port injecté par Render
server.port=${PORT:8080}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true