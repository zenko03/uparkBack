spring.application.name=upark
server.port=${PORT:8080}

# === DATABASE (Spring Boot lit automatiquement les 3 variables ci-dessus) ===
# NE RIEN ÉCRIRE ICI POUR url/username/password/driver → Spring Boot 3.5+ les prend tout seul

# === JPA / HIBERNATE ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Obligatoire sur Render en 2025 quand on ne met pas driver-class-name
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SSL obligatoire sur Render PostgreSQL
spring.datasource.hikari.data-source-properties=sslmode=require

# Logs pour vérifier que tout est bon
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE