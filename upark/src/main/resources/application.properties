# =============================================
# application.properties → Render 2025 (fonctionne à coup sûr)
# =============================================

spring.application.name=upark

# Port injecté automatiquement par Render
server.port=${PORT:8080}

# =============================================
# BASE DE DONNÉES – LA SEULE CHOSE À FAIRE SUR RENDER :
# Ajouter cette variable d’environnement :
# Key   → SPRING_DATASOURCE_URL
# Value → postgres://upark_db_user:W5axyN3LNZE6d1hitwUXuNk2DhOgu41m@dpg-d4e2ccer433s738dvm0g-a.frankfurt-postgres.render.com/upark_db
# =============================================

# Spring Boot 3.3+ reconnaît automatiquement SPRING_DATASOURCE_URL au format postgres://
# → il le convertit tout seul en jdbc:postgresql://…
spring.datasource.url=${SPRING_DATASOURCE_URL}

# Le driver est détecté automatiquement, mais on le force pour être tranquille
spring.datasource.driver-class-name=org.postgresql.Driver

# Optionnel : username/password (Render les met parfois dans l’URL, donc pas obligatoire)
# spring.datasource.username=upark_db_user
# spring.datasource.password=W5axyN3LNZE6d1hitwUXuNk2DhOgu41m

# =============================================
# JPA / Hibernate
# =============================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Le dialecte est détecté automatiquement depuis Spring Boot 3, mais on peut le garder (inoffensif)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# Logging (optionnel mais très utile en prod)
# =============================================

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
logging.level.com.zaxxer.hikari=debug