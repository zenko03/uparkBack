spring.application.name=upark
server.port=${PORT:8080}

# === DATABASE : rien à mettre, Render injecte DATABASE_URL → Spring Boot le lit automatiquement ===

# === JPA / HIBERNATE : CRITIQUES POUR SUPABASE GRATUIT ===
spring.jpa.hibernate.ddl-auto=none          # <--- LA LIGNE QUI SAUVE TOUT
# ou au pire : validate (mais none = 100% safe)

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# === HIKARI : ON FORCE UN POOL TRÈS PETIT ===
spring.datasource.hikari.maximum-pool-size=3        # <--- 3 au lieu de 10 (défaut)
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000        # 5 min
spring.datasource.hikari.max-lifetime=600000        # 10 min
spring.datasource.hikari.connection-timeout=20000

# SSL obligatoire sur Supabase + Render
spring.datasource.hikari.data-source-properties=sslmode=require

# Option bonus : désactive la vérification lourde au démarrage
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# === LOGS (très utiles en prod) ===
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.com.zaxxer.hikari=DEBUG